# GitHub Actions CI — Distributed Search Engine
#
# Builds and runs the complete test suite on every push and pull request.
# Uses CMake + CTest on Ubuntu with GCC.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Verify compiler supports C++20
        run: g++ --version

      - name: Configure project
        run: cmake -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build-ci -j$(nproc)

      - name: Run test suite
        run: ctest --test-dir build-ci --output-on-failure
